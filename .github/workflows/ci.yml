name: Supplier Pipeline CI

on:
  pull_request:
    branches:
      - main

jobs:

  validate:
    name: Validate Pipeline
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check Lambda Python syntax
        run: python -m py_compile Lambda/handler.py